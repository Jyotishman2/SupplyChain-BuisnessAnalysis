services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      SUPPLY_CHAIN_PROJECT_ROOT: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPARK_JOB_PATH: ${SPARK_JOB_PATH:-spark/jobs/inventory_processing.py}
      SPARK_SUBMIT_COMMAND: ${SPARK_SUBMIT_COMMAND:-spark-submit --packages org.postgresql:postgresql:42.7.4}
      SPARK_OUTPUT_PATH: ${SPARK_OUTPUT_PATH:-data/processed}
      SPARK_LOAD_JOB_PATH: ${SPARK_LOAD_JOB_PATH:-spark/jobs/load_inventory_outputs.py}
      SPARK_LOAD_SUBMIT_COMMAND: ${SPARK_LOAD_SUBMIT_COMMAND:-spark-submit --packages org.postgresql:postgresql:42.7.4}
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR:-}
      DBT_COMMAND: ${DBT_COMMAND:-dbt}
      ANALYTICAL_OUTPUT_TABLES: ${ANALYTICAL_OUTPUT_TABLES:-}
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/airflow/project
    command: >-
      bash -c "airflow db migrate &&
      airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME:-airflow}
      --password $${AIRFLOW_ADMIN_PASSWORD:-airflow}
      --firstname Supply
      --lastname Chain
      --role Admin
      --email $${AIRFLOW_ADMIN_EMAIL:-airflow@example.com} || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  airflow-db-data: